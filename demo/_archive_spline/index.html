<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spline Demo — Pujan Parikh</title>

    <!-- Spline web component (no build step, no npm) -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js"></script>

    <!-- Preload the scene file so it starts downloading immediately -->
    <link rel="preload" href="https://prod.spline.design/bPfn8cG1FWzDgajG/scene.splinecode" as="fetch" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Fallback shown if Spline fails to load or device is too weak -->
<div class="spline-fallback" id="spline-fallback" aria-hidden="true"></div>

<!-- 3D background layer -->
<div class="spline-bg" id="spline-bg">
    <spline-viewer
        id="spline-viewer"
        url="https://prod.spline.design/bPfn8cG1FWzDgajG/scene.splinecode"
        events-target="global"
        style="width:100%;height:100%;">
    </spline-viewer>
</div>

<!-- Foreground content (sits above the scene) -->
<main class="content">
    <header class="topbar">
        <a class="brand" href="../">← Back to portfolio</a>
        <nav class="nav">
            <a href="#about">About</a>
            <a href="#work">Work</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <p class="eyebrow">DEMO ✦ Spline navigation revamp</p>
        <h1>Pujan Parikh</h1>
        <p class="tagline">Software engineer. 3D scene goes behind this text.</p>
    </section>
</main>

<script src="demo.js"></script>

</body>
</html>
